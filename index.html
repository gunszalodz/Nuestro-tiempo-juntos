<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b0b3f">
<title>Nuestro Amor</title>

<meta name="apple-mobile-web-app-title" content="Nuestro Amor">

<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-dark: #2b0b3f;
    --bg-pink: linear-gradient(180deg, #ff4d8d 0%, #d9186b 100%);
    --text-light: #ffffff;
    --text-muted: #ffcce0;
  }

  html {
    background: var(--bg-dark);
    background-image: radial-gradient(circle at 50% 0%, #4a156b 0%, #2b0b3f 70%);
    background-attachment: fixed;
  }

  body {
    width: 100%;
    min-height: 100vh;
    color: var(--text-light);
    font-family: 'Poppins', sans-serif;
    display: flex; justify-content: center; align-items: center;
    padding: 16px;
    overflow-x: hidden;
  }

  .app-container {
    width: 100%;
    max-width: 400px;
    height: 680px;
    flex: 0 0 auto;
    background: var(--bg-pink);
    border-radius: 32px;
    padding: 30px 24px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.1);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .app-container::before {
    content: '';
    position: absolute;
    top: -50px; right: -50px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .num {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }

  /* Pantalla de Contador */
  #screen-counter {
    display: flex;
    flex-direction: column;
    height: 100%;
    flex: 1;
    position: relative;
    min-width: 0;
  }

  .names-display {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 700;
    text-align: center;
    margin-top: 10px;
    line-height: 1.2;
    color: #ffffff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .together-text {
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    color: rgba(255, 255, 255, 0.85);
    margin-top: 5px;
    margin-bottom: 8px;
    width: 100%;
  }

  /* Texto de la fecha (1 punto más grande) */
  .date-display {
    text-align: center;
    font-size: 0.9rem; 
    color: rgba(255,255,255,0.85);
    margin-bottom: 25px;
    font-weight: 500;
    width: 100%;
  }

  /* Reloj principal */
  .main-timer {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 20px 15px;
    text-align: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    border: 1.5px solid rgba(255,255,255,0.25);
    margin-bottom: 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    height: 240px;
    flex: 0 0 240px;
    overflow: hidden;
  }

  .timer-years, .timer-months-days, .timer-live {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 6px;
    white-space: nowrap;
  }

  .timer-years { height: 70px; align-items: center; }
  .timer-years .val { font-size: 4.5rem; font-weight: 700; line-height: 1; text-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  .timer-years .unit { font-size: 1.6rem; font-weight: 500; }

  .timer-months-days { height: 40px; }
  .timer-months-days .val { font-size: 1.8rem; font-weight: 600; text-shadow: 0 2px 5px rgba(0,0,0,0.15); }
  .timer-months-days .unit { font-size: 1.1rem; font-weight: 500; }
  .timer-months-days .sep { font-size: 1.4rem; opacity: .8; }

  .timer-live { height: 40px; color: #ffebf3; gap: 4px; }
  .timer-live .val {
    font-size: 1.5rem; font-weight: 500;
    display: inline-block;
    min-width: 2ch;
    text-align: center;
  }
  .timer-live .unit { font-size: 1rem; opacity: .85; margin-right: 6px; }
  .timer-live .unit:last-child { margin-right: 0; }

  .unit { font-family: 'Poppins', sans-serif; }

  /* Totales */
  .totals-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 20px;
    width: 100%;
  }

  .total-box {
    background: rgba(0,0,0,0.25);
    border-radius: 16px;
    padding: 12px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.1);
    overflow: hidden;
    min-width: 0;
    height: 74px;
  }

  .total-box strong {
    font-size: 1.35rem;
    font-weight: 700;
    display: block;
    line-height: 1.2;
    color: #ffffff;
    white-space: nowrap;
  }

  .total-box span {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    margin-top: 2px;
  }

  /* Botón flotante de opciones */
  .btn-fab {
    position: absolute;
    bottom: 8px;
    right: 8px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.2);
    color: white;
    font-size: 0.9rem;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(5px);
    z-index: 10;
    opacity: 0.7;
    transition: opacity 0.2s, background 0.2s;
  }
  .btn-fab:hover, .btn-fab:active { 
    background: rgba(0,0,0,0.4); 
    opacity: 1;
  }

  /* ========================================== */
  /* MENÚ INFERIOR COMPACTO                     */
  /* ========================================== */
  .modal-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: flex-end; /* Alineado abajo */
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 100;
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }

  .modal-content {
    background: #ffffff;
    width: 100%;
    border-radius: 20px 20px 0 0;
    padding: 16px 24px 30px 24px; /* Relleno ajustado */
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex;
    flex-direction: column;
    gap: 8px; /* Separación pequeña */
  }
  .modal-overlay.active .modal-content { transform: translateY(0); }

  .modal-title {
    color: #333;
    font-size: 0.95rem;
    font-weight: 600;
    text-align: center;
    margin-bottom: 4px;
  }

  /* Quitar bordes por defecto del navegador */
  .btn-option, .btn-close {
    border: none !important;
    outline: none !important;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
  }

  .btn-option {
    background: #f0f0f5;
    color: #333;
    font-weight: 500;
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 0.9rem;
    width: 100%;
  }
  
  .btn-close {
    background: transparent;
    color: #888;
    font-weight: 600;
    padding: 8px;
    margin-top: 2px;
    font-size: 0.9rem;
    width: 100%;
  }
</style>
</head>
<body>

<div class="app-container">

  <!-- PANTALLA ÚNICA: CONTADOR -->
  <div id="screen-counter">
    <h2 id="coupleNames" class="names-display"></h2>
    <p class="together-text">Nuestro tiempo juntos</p>
    <p id="startLabel" class="date-display"></p>

    <div class="main-timer num">
      <div class="timer-years">
        <span class="val" id="years">0</span>
        <span class="unit">años</span>
      </div>
      <div class="timer-months-days">
        <span class="val" id="months">0</span><span class="unit">meses</span>
        <span class="sep">·</span>
        <span class="val" id="days">0</span><span class="unit">días</span>
      </div>
      <div class="timer-live">
        <span class="val" id="hours">00</span><span class="unit">h</span>
        <span class="val" id="minutes">00</span><span class="unit">m</span>
        <span class="val" id="seconds">00</span><span class="unit">s</span>
      </div>
    </div>

    <div class="totals-grid num">
      <div class="total-box">
        <strong id="totalDays">0</strong>
        <span>Días</span>
      </div>
      <div class="total-box">
        <strong id="totalHours">0</strong>
        <span>Horas</span>
      </div>
      <div class="total-box">
        <strong id="totalMinutes">0</strong>
        <span>Minutos</span>
      </div>
      <div class="total-box">
        <strong id="totalSeconds">0</strong>
        <span>Segundos</span>
      </div>
    </div>

    <!-- Botón flotante de opciones -->
    <button id="optionsBtn" class="btn-fab">⚙️</button>
  </div>

  <!-- MENÚ DESDE ABAJO -->
  <div id="optionsModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-title">Opciones</div>
      <button id="saveBackupBtn" class="btn-option">💾 Guardar copia</button>
      <button id="restoreBackupBtn" class="btn-option">📂 Restaurar copia</button>
      <button id="closeModalBtn" class="btn-close">Cancelar</button>
    </div>
  </div>

  <!-- Input oculto para restaurar -->
  <input type="file" id="fileInput" accept=".json" style="display: none;">
  
</div>

<script>
(function(){
  'use strict';
  
  // =========================================================================
  // 👇 ¡AQUÍ ESTÁN TUS DATOS! EDITA ESTAS DOS LÍNEAS CON TU INFORMACIÓN 👇
  // =========================================================================
  var data = {
    names: "Gonzalo y Giny", 
    start: "2024-05-03T00:00:00", 
    hasTime: false 
  };
  // =========================================================================
  // 👆 NO TOQUES NADA DE AQUÍ PARA ABAJO A MENOS QUE SEPAS QUÉ HACES 👆
  // =========================================================================

  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var $ = function(id){ return document.getElementById(id); };
  var timer = null;

  function fmt(n){ return n.toLocaleString('es-ES'); }
  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function addMonths(date, n){
    var d = new Date(date.getTime()); var day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
    var dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, dim)); return d;
  }
  function addDays(date, n){ var d = new Date(date.getTime()); d.setDate(d.getDate() + n); return d; }

  function breakdown(start, end){
    if (end <= start) return { y:0,m:0,d:0,h:0,mi:0,s:0 };
    var cursor = new Date(start.getTime()); var y = 0, m = 0, d = 0, next;
    next = addMonths(cursor, 12); while (next <= end) { cursor = next; y++; next = addMonths(cursor, 12); }
    next = addMonths(cursor, 1); while (next <= end) { cursor = next; m++; next = addMonths(cursor, 1); }
    next = addDays(cursor, 1); while (next <= end) { cursor = next; d++; next = addDays(cursor, 1); }
    var rem = end.getTime() - cursor.getTime();
    return { y: y, m: m, d: d, h: Math.floor(rem / 3600000), mi: Math.floor((rem % 3600000) / 60000), s: Math.floor((rem % 60000) / 1000) };
  }

  function formatStart(d, hasTime){
    var s = d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear();
    if (hasTime) s += ' · ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    return 'Desde el ' + s;
  }

  function render(){
    var start = new Date(data.start); var now = new Date();
    $('coupleNames').textContent = data.names; $('startLabel').textContent = formatStart(start, data.hasTime);
    var b = breakdown(start, now);
    $('years').textContent = fmt(b.y); $('months').textContent = fmt(b.m); $('days').textContent = fmt(b.d);
    $('hours').textContent = pad(b.h); $('minutes').textContent = pad(b.mi); $('seconds').textContent = pad(b.s);
    var ms = Math.max(0, now.getTime() - start.getTime());
    $('totalDays').textContent = fmt(Math.floor(ms / 86400000)); $('totalHours').textContent = fmt(Math.floor(ms / 3600000));
    $('totalMinutes').textContent = fmt(Math.floor(ms / 60000)); $('totalSeconds').textContent = fmt(Math.floor(ms / 1000));
  }

  function startTimer(){ stopTimer(); render(); (function loop(){ timer = setTimeout(function(){ render(); loop(); }, 1000 - (Date.now() % 1000) + 5); })(); }
  function stopTimer(){ if (timer) { clearTimeout(timer); timer = null; } }
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && timer) render(); });

  // Control del Modal
  $('optionsBtn').addEventListener('click', function() { $('optionsModal').classList.add('active'); });
  $('closeModalBtn').addEventListener('click', function() { $('optionsModal').classList.remove('active'); });

  // Guardar copia
  $('saveBackupBtn').addEventListener('click', function() {
    var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));
    var a = document.createElement('a'); a.setAttribute("href", dataStr); a.setAttribute("download", "nuestro_amor_backup.json");
    document.body.appendChild(a); a.click(); a.remove(); $('optionsModal').classList.remove('active');
  });

  // Restaurar copia
  $('restoreBackupBtn').addEventListener('click', function() { $('fileInput').click(); });

  $('fileInput').addEventListener('change', function(e) {
    var file = e.target.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var importedData = JSON.parse(ev.target.result);
        if (importedData.names && importedData.start) {
          data = importedData; 
          render(); 
          $('optionsModal').classList.remove('active');
          alert("Copia restaurada con éxito.");
        } else { alert("El archivo no tiene el formato correcto."); }
      } catch (err) { alert("Error al leer el archivo."); }
    };
    reader.readAsText(file); this.value = '';
  });

  // Iniciar aplicación
  startTimer();
})();

// ==========================================
// REGISTRO DE LA PWA
// ==========================================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(registration => { console.log('SW registrado'); })
      .catch(error => { console.log('Error SW:', error); });
  });
}
</script>
</body>
</html>
